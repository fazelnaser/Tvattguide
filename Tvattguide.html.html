<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tvättguide KTT86V42</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --enamel:#EEF2F5;
  --paper:#FFFFFF;
  --ink:#17212C;
  --steel:#7D8B99;
  --line:#D3DBE2;
  --glass:#081621;
  --led:#5CCBFF;
  --led-dim:rgba(92,203,255,.16);
  --amber:#B86E00;
  --amber-bg:#FFF4E2;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--enamel);color:var(--ink);font:400 17px/1.5 Barlow,system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 64px}
header h1{font:700 30px/1.1 "Barlow Semi Condensed",sans-serif;margin:8px 0 4px;letter-spacing:-.01em}
header p{margin:0 0 20px;color:var(--steel)}

/* Filter */
.filters{display:grid;gap:10px;margin-bottom:22px}
.dd{position:relative}
.dd-label{font:600 14px/1 "Barlow Semi Condensed",sans-serif;color:var(--steel);margin:0 0 6px 2px}
.dd-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;
  font:500 18px/1.2 Barlow,sans-serif;color:var(--ink);cursor:pointer;text-align:left}
.dd-btn:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.dd-btn .ph{color:var(--steel)}
.dd-btn svg{flex:none;transition:transform .2s}
.dd[data-open="true"] .dd-btn{border-color:var(--ink)}
.dd[data-open="true"] .dd-btn svg{transform:rotate(180deg)}
.dd-list{display:none;margin:6px 0 0;padding:6px;list-style:none;background:var(--paper);
  border:1.5px solid var(--ink);border-radius:12px}
.dd[data-open="true"] .dd-list{display:block}
.dd-group{font:600 13px/1 "Barlow Semi Condensed",sans-serif;color:var(--steel);padding:12px 10px 6px}
.dd-opt{display:flex;justify-content:space-between;padding:11px 10px;border-radius:8px;cursor:pointer}
.dd-opt:hover,.dd-opt:focus-visible{background:var(--enamel);outline:none}
.dd-opt[aria-selected="true"]{font-weight:600}
.dd-opt small{color:var(--steel);font-size:15px}
.hidden{display:none!important}

/* LED-panelen */
.panel{background:var(--glass);border-radius:16px;padding:18px 18px 16px;color:var(--led);margin-bottom:26px}
.panel-cap{font:500 14px/1.2 Barlow,sans-serif;color:#8FA5B6;margin:0 0 12px}
.panel-grid{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 18px;align-items:start}
.prog{font:700 26px/1.05 "Barlow Semi Condensed",sans-serif;letter-spacing:.01em;text-shadow:0 0 12px rgba(92,203,255,.45)}
.col{display:grid;gap:2px;font:600 16px/1.35 "Barlow Semi Condensed",sans-serif;text-align:right}
.col span{color:var(--led-dim)}
.col span.on{color:var(--led);text-shadow:0 0 10px rgba(92,203,255,.6)}
.opts{display:grid;gap:2px}
.opt{display:flex;align-items:center;gap:6px;height:21.6px}
.opt .ic{width:24px;height:19px}
.opt .ic.ck{width:16px;height:14px}
.ic{display:inline-block;background:var(--led);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;vertical-align:middle}
.ic.dim{background:var(--led-dim)}
.dry{display:flex;gap:14px;margin-top:10px;align-items:center}
.dry .ic{width:26px;height:24px}
.panel .note{margin:12px 0 0;font:500 14px/1.35 Barlow,sans-serif;color:#8FA5B6}

/* Steg */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.step{display:grid;grid-template-columns:104px 1fr;gap:14px;background:var(--paper);border-radius:14px;padding:14px;align-items:center}
.step.noimg{grid-template-columns:1fr}
.step figure{margin:0;display:flex;justify-content:center;align-items:center;height:92px}
.step figure img{max-width:100%;max-height:92px}
.step figure.led{background:var(--glass);border-radius:10px}
.step figure.led .ic{width:48px;height:44px}
.step h3{font:700 15px/1 "Barlow Semi Condensed",sans-serif;color:var(--steel);margin:0 0 4px}
.step p{margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--glass);color:var(--led);border-radius:6px;padding:0 7px;
  font:600 15px/1.6 "Barlow Semi Condensed",sans-serif;vertical-align:1px;white-space:nowrap}
.chip .ic{width:18px;height:16px}
.warn{background:var(--amber-bg);border-left:4px solid var(--amber);border-radius:10px;padding:12px 14px;margin:12px 0 0;font-size:16px}
.warn b{color:var(--amber)}
.empty{background:var(--paper);border-radius:14px;padding:22px;color:var(--steel)}
.ref{margin-top:28px;font-size:14px;color:var(--steel)}
.ref img{width:100%;background:#fff;border-radius:12px;padding:8px;margin-top:8px}
@media (max-width:420px){
  .step{grid-template-columns:84px 1fr;gap:12px;padding:12px}
  .step figure{height:76px}.step figure img{max-height:76px}
  .panel-grid{gap:4px 12px}.prog{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const MASKIN = {
  underhall:{namn:'Underhåll av filter och bälg'},
  kalibrering:{namn:'Kalibrering'}
};

const state = {vad:null, tork:'med', plats:'hemma'};

const FILTERS = [
  {key:'vad', label:'Vad ska göras?', placeholder:'Välj',
    groups:[
      {namn:'Tvätt', opts:Object.entries(TYPER).map(([k,v])=>({k, namn:v.namn, sub:`${v.program} ${v.temp} °C`}))},
      {namn:'Maskinen', opts:Object.entries(MASKIN).map(([k,v])=>({k, namn:v.namn}))}
    ]},
  {key:'tork', label:'Torkning', groups:[{opts:[{k:'med',namn:'Med tork'},{k:'utan',namn:'Utan tork'}]}]},
  {key:'plats', label:'Är du hemma?', groups:[{opts:[{k:'hemma',namn:'Hemma'},{k:'borta',namn:'Borta'}]}]}
];

function optName(f, k){
  for(const g of f.groups) for(const o of g.opts) if(o.k===k) return o.namn;
  return null;
}

function renderFilters(){
  const el = document.getElementById('filters');
  const isMaskin = state.vad && MASKIN[state.vad];
  el.innerHTML = FILTERS.map(f=>{
    const hide = f.key!=='vad' && (!state.vad || isMaskin);
    const val = optName(f, state[f.key]);
    return `<div class="dd ${hide?'hidden':''}" data-key="${f.key}" data-open="false">
      <div class="dd-label" id="lbl-${f.key}">${f.label}</div>
      <button class="dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="lbl-${f.key}">
        <span class="${val?'':'ph'}">${val||f.placeholder}</span>${chev}
      </button>
      <ul class="dd-list" role="listbox" aria-labelledby="lbl-${f.key}">
        ${f.groups.map(g=>`${g.namn?`<li class="dd-group" role="presentation">${g.namn}</li>`:''}
          ${g.opts.map(o=>`<li class="dd-opt" role="option" tabindex="0" data-k="${o.k}" aria-selected="${state[f.key]===o.k}">
            <span>${o.namn}</span>${o.sub?`<small>${o.sub}</small>`:''}</li>`).join('')}`).join('')}
      </ul></div>`;
  }).join('');
}

function closeAll(except){
  document.querySelectorAll('.dd').forEach(d=>{
    if(d!==except){d.dataset.open='false';d.querySelector('.dd-btn').setAttribute('aria-expanded','false');}
  });
}

document.addEventListener('click', e=>{
  const btn = e.target.closest('.dd-btn');
  const opt = e.target.closest('.dd-opt');
  if(btn){
    const dd = btn.closest('.dd'); const open = dd.dataset.open!=='true';
    closeAll(dd); dd.dataset.open = open; btn.setAttribute('aria-expanded', open);
    if(open) dd.querySelector('.dd-opt[aria-selected="true"], .dd-opt')?.focus();
    return;
  }
  if(opt){ choose(opt); return; }
  if(!e.target.closest('.dd')) closeAll();
});
document.addEventListener('keydown', e=>{
  const opt = e.target.closest && e.target.closest('.dd-opt');
  if(opt && (e.key==='Enter'||e.key===' ')){e.preventDefault();choose(opt);}
  if(opt && (e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();
    const all=[...opt.closest('.dd-list').querySelectorAll('.dd-opt')];
    const i=all.indexOf(opt)+(e.key==='ArrowDown'?1:-1);
    all[(i+all.length)%all.length].focus();
  }
  if(e.key==='Escape'){
    const dd=document.querySelector('.dd[data-open="true"]');
    closeAll(); dd?.querySelector('.dd-btn').focus();
  }
});

function choose(opt){
  const key = opt.closest('.dd').dataset.key;
  state[key] = opt.dataset.k;
  renderAll();
  document.querySelector(`.dd[data-key="${key}"] .dd-btn`)?.focus();
}

/* Beräkna inställningar */
function settings(){
  const t = TYPER[state.vad];
  let s = {program:t.program, temp:t.temp, varv:t.varv, tork:null, info:[]};
  if(state.tork==='med'){
    if(t.medTork){ Object.assign(s, t.medTork); s.info.push(t.medTork.info); }
    else if(t.tork){ s.tork = t.tork; }
  }
  s.skrynkel = state.plats==='borta' && !!s.tork;
  return s;
}

function panel(s){
  const temps=['90','60','40','30','20'], varv=['1400','1200','1000','800','600'];
  const fn=[['o_fortvatt',false],['o_extratvatt',false],['o_snabb',false],['o_extraskolj',false],['o_skrynkel',s.skrynkel]];
  const dry=['luft','sol_skonsam','sol_normal','sol_extra'];
  const onDry = s.tork ? TORK[s.tork].ikon : null;
  return `<div class="panel" aria-label="Så ska displayen vara inställd">
    <p class="panel-cap">Så ska det vara inställt</p>
    <div class="panel-grid">
      <div><div class="prog">${s.program}</div>
        <div class="dry">${dry.map(d=>ic(d, d===onDry?'':'dim')).join('')}</div></div>
      <div class="col">${temps.map(t=>`<span class="${t===s.temp?'on':''}">${t}°C</span>`).join('')}</div>
      <div class="col">${varv.map(v=>`<span class="${v===s.varv?'on':''}">${v}</span>`).join('')}</div>
      <div class="opts">${fn.map(([n,on])=>`<div class="opt">${ic(n, on?'':'dim')}${on?ic('bock','ck'):''}</div>`).join('')}</div>
    </div>
    <p class="note">${s.tork?`Torkning: ${TORK[s.tork].namn}`:'Ingen torkning'}${s.skrynkel?' och antiskrynkel':''}</p>
  </div>`;
}

const img = (n, alt) => `<figure><img src="${IC[n]}" alt="${alt||''}"></figure>`;
const led = n => `<figure class="led">${ic(n)}</figure>`;

function stepsHtml(list){
  return `<ol class="steps">${list.map((st,i)=>`<li class="step ${st.fig?'':'noimg'}">
    ${st.fig||''}<div><h3>Steg ${i+1}</h3><p>${st.text}</p>${st.warn?`<div class="warn">${st.warn}</div>`:''}</div></li>`).join('')}</ol>`;
}

function tvattGuide(){
  const t = TYPER[state.vad], s = settings(), borta = state.plats==='borta';
  const steps = [];
  const varningar = [];
  if(state.tork==='med' && !s.tork && t.ingenTork) varningar.push(t.ingenTork);

  steps.push({fig:img(t.prep[0]), text:t.prep[1]});
  const max = s.tork ? t.torkMax : t.tvatt;
  steps.push({fig:img('lasta'), text:`Lägg i högst ${max}. Lägg inte i ett ensamt plagg, det ger obalans.`});
  steps.push({fig:img('fack'), text:`Tvättmedel i fack II. ${t.mjuk?'Sköljmedel i blomfacket om du vill.':'Inget sköljmedel.'}${t.extra?' '+t.extra:''}`});
  steps.push({fig:img('stang'), text:'Stäng luckan, öppna vattenkranen och tryck på På/Av.'});
  steps.push({fig:img('program'), text:`Vrid ratten till ${chip(s.program)}.`, warn:s.info.length?s.info.join(' '):null});
  steps.push({fig:img('funktion'), text:`Tryck på Temp. tills ${chip(s.temp+' °C')} är valt. Tryck på Centrifug. tills ${chip(s.varv)} är valt.`});
  if(s.tork){
    steps.push({fig:led(TORK[s.tork].ikon),
      text:`Tryck på Torkning tills ${chip(ic(TORK[s.tork].ikon)+' '+TORK[s.tork].namn)} lyser under fasikonerna.`,
      warn:t.torkVarning||null});
  }
  if(s.skrynkel){
    steps.push({fig:led('o_skrynkel'),
      text:`Tryck på Funktion tills strykjärnet är markerat och bekräfta med Välj. En bock ${chip(ic('bock'))} ska synas bredvid.`});
  }
  if(borta){
    steps.push({fig:led('fordroj'),
      text: s.tork
        ? 'Vill du att den ska bli klar senare? Håll in Fördröj och välj antal timmar.'
        : 'Håll in Fördröj och välj antal timmar så att tvätten är klar när du kommer hem. Då blir den inte liggande blöt.'});
  }
  steps.push({fig:img('start'), text:'Tryck på Start/Paus. Kontrollera att tiden börjar räknas.'});
  const efter = s.tork
    ? 'När End visas: ta ut tvätten direkt. Torka av glaset och gummibälgen från ludd.'
    : (state.vad==='ylle'
        ? 'När End visas: ta ut plaggen direkt och lägg dem plant på tork. Torka av glaset och gummibälgen.'
        : 'När End visas: häng tvätten direkt. Torka av glaset och gummibälgen.');
  steps.push({fig:img('balg'), text:efter});

  let html = panel(s);
  if(varningar.length) html += `<div class="warn" style="margin:-12px 0 20px">${varningar.join(' ')}</div>`;
  html += stepsHtml(steps);
  if(borta) html += `<div class="warn"><b>När du är borta.</b> Vattenkranen står öppen hela programmet. Kontrollera villkoren i hemförsäkringen och överväg en läckagevakt på golvet.</div>`;
  return html;
}

function underhallGuide(){
  return stepsHtml([
    {text:'Vänta tills programmet är klart och maskinen är tom. Dra ur kontakten och stäng vattenkranen.',
     warn:'<b>Varmt vatten.</b> Öppna aldrig filtret under ett program.'},
    {fig:img('balg'), text:'Torka av glaset och gummibälgen. Plocka bort ludd, mynt och knappar. Gör det efter varje tvätt.'},
    {fig:img('filter1'), text:'Lägg en handduk på golvet och öppna den nedre luckan.'},
    {fig:img('filter2'), text:'Vrid nödavloppsslangen 90 grader, dra ut den och ta av locket.'},
    {fig:img('filter3'), text:'Låt vattnet rinna ut i en låg skål. Sätt tillbaka locket och slangen.'},
    {fig:img('filter4'), text:'Skruva ut filtret motsols.'},
    {fig:img('filter5'), text:'Ta bort ludd och föremål och skölj filtret under kranen.'},
    {fig:img('filter6'), text:'Skruva tillbaka filtret ordentligt och stäng luckan.',
     warn:'<b>Kontrollera att filtret sitter fast.</b> Annars kan maskinen läcka.'}
  ]);
}

function kalibreringGuide(){
  return stepsHtml([
    {fig:img('lasta'), text:'Ta ut all tvätt. Trumman ska vara tom.'},
    {fig:img('kran'), text:'Anslut elen och öppna vattenkranen.'},
    {fig:img('funktion'), text:`Håll in Fördröj och Temp. samtidigt tills displayen visar ${chip('t19')}.`},
    {fig:img('start'), text:`Tryck på Start/Paus och vänta tills displayen visar ${chip(ic('playpaus'))}.`}
  ]) + `<div class="warn">Manualen rekommenderar kalibrering men anger inte hur ofta. Gör det efter installation eller flytt.</div>`;
}

function renderGuide(){
  const g = document.getElementById('guide');
  if(!state.vad){ g.innerHTML = '<div class="empty">Välj vad som ska göras i listan ovan.</div>'; return; }
  if(state.vad==='underhall') g.innerHTML = underhallGuide();
  else if(state.vad==='kalibrering') g.innerHTML = kalibreringGuide();
  else g.innerHTML = tvattGuide();
}

function renderAll(){ renderFilters(); renderGuide(); }

document.getElementById('panelImg').src = IC.panel;
renderAll();
</script>
